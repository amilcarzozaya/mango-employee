name: Bootstrap MANGO Employee RC1
on:
  push:
    paths:
      - '.bootstrap/READY'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct RC1
        shell: bash
        run: |
          cat .bootstrap/part-0?.txt | base64 -d > /tmp/mango-employee-rc1.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/mango-employee-rc1.zip') as z:
              z.extractall('.')
          PY
      - name: Commit RC1
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-rc1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MANGO Employee v0.12 RC1 — Release Candidate"
          git push
