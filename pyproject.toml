[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-employee-cli"
version = "0.12.0rc2"
description = "Portable runtime, specification and safety framework for MANGO AI Employees"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Amílcar Zozaya"}]
dependencies = []

[project.scripts]
mango = "mango_cli.cli:main"

[tool.setuptools.packages.find]
include = ["mango_cli*"]
